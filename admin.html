<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Enlaces de cobro</title>
<link rel="stylesheet" href="styles.css">
<style>
details.list{margin-bottom:10px}
details>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{border-bottom:1px solid var(--line)}
.body{padding:4px 16px 16px}
.two{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.aviso{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.aviso:first-child{border-top:0}
.tabs{display:flex;gap:8px;margin:18px 0 0}
.tabs button{flex:1}
</style>
</head>
<body>
<main id="app"></main>
<script src="api.js"></script>
<script>
const app = document.getElementById("app");
let clave = null, personas = [], abierta = null, filtro = "pend";
try { clave = localStorage.getItem("cobros_clave"); } catch (e) {}

const linkDe = (p) => `${location.origin}${location.pathname.replace(/admin(\.html)?$/, "")}?c=${p.token}`;
const primerNombre = (p) => p.nombre.split(" ")[0];
function waNumber(t) {
  const d = String(t).replace(/\D/g, "");
  return d.length === 9 ? "34" + d : d; // móviles de España sin prefijo
}
const waUrl = (p, msg) => `https://wa.me/${waNumber(p.telefono)}?text=${encodeURIComponent(msg)}`;

function login(msg) {
  app.innerHTML = `
    <h1>Enlaces de cobro</h1>
    <p class="muted">Entra con tu clave de administrador.</p>
    <form id="f" class="card">
      <label for="k">Clave</label>
      <input id="k" type="password" autocomplete="current-password" required>
      <div class="actions"><button>Entrar</button></div>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ""}
    </form>`;
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    clave = document.getElementById("k").value.trim();
    await cargar();
  };
}

async function cargar() {
  try {
    personas = await rpc("cobros_admin_resumen", { p_clave: clave });
    try { localStorage.setItem("cobros_clave", clave); } catch (e) {}
    render();
  } catch (e) {
    try { localStorage.removeItem("cobros_clave"); } catch (_) {}
    login(e.message.includes("clave") ? "Clave incorrecta" : e.message);
  }
}

function msgAbono(p, a) {
  const r = resumen(p);
  return `Hola ${primerNombre(p)}, recibí tu abono de ${money(a.monto)} del ${fecha(a.fecha)}. ¡Gracias! ` +
    (r.saldo > 0 ? `Te queda un saldo de ${money(r.saldo)}.` : "Con esto quedas al día.") +
    ` Puedes ver tu estado de cuenta aquí: ${linkDe(p)}`;
}

function render() {
  const total = personas.reduce((s, p) => s + resumen(p).saldo, 0);
  const pendientes = personas.flatMap((p) => p.abonos.filter((a) => !a.avisado).map((a) => ({ p, a })));
  const lista = personas.filter((p) => filtro === "all" || resumen(p).saldo > 0)
    .sort((a, b) => resumen(b).saldo - resumen(a).saldo);

  app.innerHTML = `
    <div class="row"><h1>Enlaces de cobro</h1><button class="ghost" id="salir">Salir</button></div>
    <p class="muted small" style="margin:4px 0 0">Los préstamos y abonos vienen de tu app <b>Mi control de dinero</b>. Aquí solo mandas los enlaces y los avisos.</p>
    <div class="grid2">
      <div class="stat"><span class="muted small">Te deben en total</span><b>${money(total)}</b></div>
      <div class="stat"><span class="muted small">Abonos sin avisar</span><b>${pendientes.length}</b></div>
    </div>

    ${pendientes.length ? `
    <h2>Avisar abonos nuevos</h2>
    <div class="list">${pendientes.map(({ p, a }) => `
      <div class="aviso">
        <div><b>${esc(p.nombre)}</b> te abonó <b>${money(a.monto)}</b><div class="small muted">${fecha(a.fecha)}${p.telefono ? "" : " · falta su WhatsApp"}</div></div>
        <div class="actions" style="margin:0;flex-wrap:nowrap">
          ${p.telefono ? `<a href="${waUrl(p, msgAbono(p, a))}" target="_blank" rel="noopener" data-avisar="${a.id}"><button type="button">Avisar</button></a>` : ""}
          <button type="button" class="ghost" data-listo="${a.id}" title="Marcar como avisado">✓</button>
        </div>
      </div>`).join("")}
    </div>` : ""}

    <div class="tabs">
      <button class="${filtro === "pend" ? "" : "ghost"}" data-filtro="pend">Con saldo pendiente</button>
      <button class="${filtro === "all" ? "" : "ghost"}" data-filtro="all">Todas</button>
    </div>
    <h2>Personas</h2>
    ${lista.map((p) => {
      const r = resumen(p);
      return `
      <details class="list" data-id="${p.id}" ${abierta === p.id ? "open" : ""}>
        <summary>
          <div><b>${esc(p.nombre)}</b><div class="small muted">Abonó ${money(p.total_abonado)} de ${money(p.total_deuda)}</div></div>
          <div class="amt">${money(r.saldo)}</div>
        </summary>
        <div class="body">
          <form data-form="tel" class="two">
            <div><label>WhatsApp</label><input name="telefono" value="${esc(p.telefono)}" placeholder="612 345 678" inputmode="tel"></div>
            <button class="ghost">Guardar</button>
          </form>
          <div class="actions">
            <button data-act="copiar">Copiar enlace</button>
            ${p.telefono ? `<button class="ghost" data-act="wa">Enviar enlace</button>` : ""}
            ${p.telefono && r.saldo > 0 ? `<button class="ghost" data-act="recordar">Recordarle el pago</button>` : ""}
            <button class="ghost" data-act="ver">Ver su página</button>
            <button class="danger" data-act="nuevo">Cambiar enlace</button>
          </div>
        </div>
      </details>`;
    }).join("") || '<p class="muted">Nadie te debe nada ahora mismo.</p>'}
    <footer>Cada persona solo ve su propia cuenta con su enlace.</footer>`;

  document.getElementById("salir").onclick = () => { try { localStorage.removeItem("cobros_clave"); } catch (e) {} clave = null; login(); };
  app.querySelectorAll("[data-filtro]").forEach((b) => (b.onclick = () => { filtro = b.dataset.filtro; render(); }));
  app.querySelectorAll("[data-avisar]").forEach((a) => a.addEventListener("click", () => marcar([a.dataset.avisar])));
  app.querySelectorAll("[data-listo]").forEach((b) => (b.onclick = () => marcar([b.dataset.listo])));
  app.querySelectorAll("details").forEach((d) => d.addEventListener("toggle", () => { if (d.open) abierta = d.dataset.id; }));
  app.querySelectorAll("details").forEach((el) => wire(el, personas.find((p) => p.id === el.dataset.id)));
}

async function marcar(ids) {
  try { await rpc("cobros_admin_avisado", { p_clave: clave, p_ids: ids }); } catch (e) { alert(e.message); }
  setTimeout(cargar, 400);
}

function wire(el, p) {
  const link = linkDe(p);
  const on = (act, fn) => { const b = el.querySelector(`[data-act="${act}"]`); if (b) b.onclick = fn; };
  on("copiar", async (e) => {
    try { await navigator.clipboard.writeText(link); e.target.textContent = "¡Copiado!"; }
    catch (_) { prompt("Copia este enlace:", link); }
  });
  on("wa", () => window.open(waUrl(p, `Hola ${primerNombre(p)}, aquí puedes ver tu estado de cuenta (lo que has abonado y lo que queda): ${link}`), "_blank"));
  on("recordar", () => {
    const r = resumen(p);
    window.open(waUrl(p, `Hola ${primerNombre(p)}, te recuerdo que tienes un saldo pendiente de ${money(r.saldo)}. Aquí puedes ver tu cuenta: ${link}`), "_blank");
  });
  on("ver", () => window.open(link, "_blank"));
  on("nuevo", async () => {
    if (!confirm(`¿Crear un enlace nuevo para ${p.nombre}? El anterior dejará de funcionar.`)) return;
    try { await rpc("cobros_admin_nuevo_enlace", { p_clave: clave, p_id: p.id }); await cargar(); }
    catch (err) { alert(err.message); }
  });
  el.querySelector('[data-form="tel"]').onsubmit = async (e) => {
    e.preventDefault();
    const b = e.target.querySelector("button"); b.disabled = true;
    try {
      await rpc("cobros_admin_persona", { p_clave: clave, p_id: p.id, p_nombre: p.nombre, p_telefono: e.target.telefono.value.trim(), p_nota: p.nota });
      await cargar();
    } catch (err) { b.disabled = false; alert(err.message); }
  };
}

clave ? cargar() : login();
</script>
</body>
</html>
