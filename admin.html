<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mis cobros</title>
<link rel="stylesheet" href="styles.css">
<style>
details.list{margin-bottom:10px}
details>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{border-bottom:1px solid var(--line)}
.body{padding:4px 16px 16px}
.forms{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.forms form{border:1px solid var(--line);border-radius:12px;padding:12px}
.forms h3{margin:0;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.aviso{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:14px 0}
.aviso a{display:inline-block;margin-top:10px;text-decoration:none}
.mini{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<script src="api.js"></script>
<script>
const app = document.getElementById("app");
let clave = null, personas = [], abierta = null, aviso = null;
try { clave = localStorage.getItem("cobros_clave"); } catch (e) {}

const linkDe = (p) => `${location.origin}${location.pathname.replace(/admin(\.html)?$/, "")}?c=${p.token}`;

function login(msg) {
  app.innerHTML = `
    <h1>Mis cobros</h1>
    <p class="muted">Entra con tu clave de administrador.</p>
    <form id="f" class="card">
      <label for="k">Clave</label>
      <input id="k" type="password" autocomplete="current-password" required>
      <div class="actions"><button>Entrar</button></div>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ""}
    </form>`;
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    clave = document.getElementById("k").value.trim();
    await cargar();
  };
}

async function cargar() {
  try {
    personas = await rpc("cobros_admin_resumen", { p_clave: clave });
    try { localStorage.setItem("cobros_clave", clave); } catch (e) {}
    render();
  } catch (e) {
    try { localStorage.removeItem("cobros_clave"); } catch (_) {}
    login(e.message.includes("clave") ? "Clave incorrecta" : e.message);
  }
}

function pill(r) {
  if (r.estado === "pagado") return '<span class="pill ok">Pagado</span>';
  if (r.estado === "bad") return '<span class="pill bad">Vencido</span>';
  if (r.estado === "warn") return '<span class="pill warn">Vence pronto</span>';
  return "";
}

function render() {
  const total = personas.reduce((s, p) => s + resumen(p).saldo, 0);
  const cobrado = personas.reduce((s, p) => s + Number(p.total_abonado), 0);
  app.innerHTML = `
    <div class="row"><h1>Mis cobros</h1><button class="ghost" id="salir">Salir</button></div>
    ${aviso ? `<div class="aviso"><b>Avisarle a ${esc(aviso.nombre)}</b><div class="small muted">${esc(aviso.texto)}</div>
      <a href="${aviso.url}" target="_blank" rel="noopener"><button type="button">Enviar por WhatsApp</button></a>
      <button type="button" class="ghost" id="cerrarAviso">Ahora no</button></div>` : ""}
    <div class="grid2">
      <div class="stat"><span class="muted small">Por cobrar</span><b>${money(total)}</b></div>
      <div class="stat"><span class="muted small">Ya cobrado</span><b>${money(cobrado)}</b></div>
    </div>

    <h2>Personas</h2>
    ${personas.length ? "" : '<p class="muted">Aún no hay nadie. Agrega a la primera persona abajo.</p>'}
    ${personas.map((p) => {
      const r = resumen(p);
      return `
      <details class="list" data-id="${p.id}" ${abierta === p.id ? "open" : ""}>
        <summary>
          <div><b>${esc(p.nombre)}</b> ${pill(r)}<div class="small muted">Abonó ${money(p.total_abonado)} de ${money(p.total_deuda)}${r.proximo ? " · paga " + fecha(r.proximo) : ""}</div></div>
          <div class="amt">${money(r.saldo)}</div>
        </summary>
        <div class="body">
          <div class="actions">
            <button data-act="copiar">Copiar enlace</button>
            ${p.telefono ? `<button class="ghost" data-act="wa">Enviar por WhatsApp</button>` : ""}
            ${p.telefono && r.saldo > 0 ? `<button class="ghost" data-act="recordar">Recordarle el pago</button>` : ""}
            <button class="ghost" data-act="ver">Ver como ${esc(p.nombre.split(" ")[0])}</button>
          </div>

          <div class="forms">
            <form data-form="abono">
              <h3>Registrar abono</h3>
              <div class="two">
                <div><label>Monto</label><input name="monto" type="number" step="0.01" min="0.01" inputmode="decimal" required></div>
                <div><label>Fecha</label><input name="fecha" type="date" value="${hoyISO()}" required></div>
              </div>
              <label>Nota (opcional)</label><input name="nota" placeholder="Yappy, efectivo…">
              <div class="actions"><button>Guardar abono</button></div>
            </form>
            <form data-form="deuda">
              <h3>Agregar deuda</h3>
              <label>Concepto</label><input name="concepto" placeholder="Préstamo, compra…" required>
              <div class="two">
                <div><label>Monto</label><input name="monto" type="number" step="0.01" min="0.01" inputmode="decimal" required></div>
                <div><label>Fecha</label><input name="fecha" type="date" value="${hoyISO()}" required></div>
              </div>
              <label>Fecha límite de pago (opcional)</label><input name="vence" type="date">
              <div class="actions"><button>Guardar deuda</button></div>
            </form>
          </div>

          <div class="sub">Deudas</div>
          ${p.deudas.map((d) => `<div class="mini"><span>${esc(d.concepto)} · ${fecha(d.fecha)}${d.vence ? " · vence " + fecha(d.vence) : ""}</span><b>${money(d.monto)}</b></div>`).join("") || '<div class="small muted">Ninguna</div>'}
          <div class="sub">Abonos</div>
          ${p.abonos.map((a) => `<div class="mini"><span>${fecha(a.fecha)}${a.nota ? " · " + esc(a.nota) : ""}</span><b>${money(a.monto)}</b></div>`).join("") || '<div class="small muted">Ninguno</div>'}

          <form data-form="persona" style="margin-top:16px">
            <div class="sub" style="margin-top:0">Datos de contacto</div>
            <div class="two">
              <div><label>Nombre</label><input name="nombre" value="${esc(p.nombre)}" required></div>
              <div><label>WhatsApp</label><input name="telefono" value="${esc(p.telefono)}" placeholder="6123-4567" inputmode="tel"></div>
            </div>
            <div class="actions"><button class="ghost">Guardar datos</button><button type="button" class="danger" data-act="nuevo">Cambiar enlace</button></div>
          </form>
        </div>
      </details>`;
    }).join("")}

    <h2>Agregar persona</h2>
    <form id="nueva" class="card">
      <div class="two">
        <div><label>Nombre</label><input name="nombre" required></div>
        <div><label>WhatsApp (opcional)</label><input name="telefono" placeholder="6123-4567" inputmode="tel"></div>
      </div>
      <label>Deuda inicial: concepto</label><input name="concepto" placeholder="Préstamo">
      <div class="two">
        <div><label>Monto</label><input name="monto" type="number" step="0.01" min="0.01" inputmode="decimal"></div>
        <div><label>Fecha límite (opcional)</label><input name="vence" type="date"></div>
      </div>
      <div class="actions"><button>Agregar</button></div>
    </form>
    <footer>Cada persona ve solo su propio enlace.</footer>`;

  const ca = document.getElementById("cerrarAviso");
  if (ca) ca.onclick = () => { aviso = null; render(); };
  app.querySelectorAll(".aviso a").forEach((a) => a.addEventListener("click", () => setTimeout(() => { aviso = null; render(); }, 300)));
  document.getElementById("salir").onclick = () => { try { localStorage.removeItem("cobros_clave"); } catch (e) {} clave = null; login(); };
  app.querySelectorAll("details").forEach((d) => d.addEventListener("toggle", () => { if (d.open) abierta = d.dataset.id; }));
  app.querySelectorAll("details").forEach((el) => wire(el, personas.find((p) => p.id === el.dataset.id)));
  document.getElementById("nueva").onsubmit = (e) => guardar(e, async (f) => {
    const id = await rpc("cobros_admin_persona", { p_clave: clave, p_id: null, p_nombre: f.nombre.value.trim(), p_telefono: f.telefono.value.trim(), p_nota: null });
    if (f.monto.value) await rpc("cobros_admin_deuda", { p_clave: clave, p_persona: id, p_concepto: f.concepto.value.trim() || "Préstamo", p_monto: Number(f.monto.value), p_fecha: hoyISO(), p_vence: f.vence.value || null });
    abierta = id;
  });
}

async function guardar(e, fn) {
  e.preventDefault();
  const f = e.target, btns = f.querySelectorAll("button");
  btns.forEach((b) => (b.disabled = true));
  aviso = null;
  try { const despues = await fn(f); await cargar(); if (despues) { aviso = despues(); render(); window.scrollTo(0, 0); } }
  catch (err) { btns.forEach((b) => (b.disabled = false)); alert("No se pudo guardar: " + err.message); }
}

const primerNombre = (p) => p.nombre.split(" ")[0];
const waUrl = (p, msg) => `https://wa.me/${waNumber(p.telefono)}?text=${encodeURIComponent(msg)}`;

// Aviso por WhatsApp con los datos ya actualizados (solo si la persona tiene número)
function avisoPara(id, texto) {
  const q = personas.find((x) => x.id === id);
  if (!q || !q.telefono) return null;
  const msg = texto(q, resumen(q));
  return { nombre: q.nombre, texto: msg, url: waUrl(q, msg) };
}

function waNumber(t) {
  const d = String(t).replace(/\D/g, "");
  return d.length === 8 ? "507" + d : d; // números de Panamá sin código de país
}

function wire(el, p) {
  const link = linkDe(p);
  el.querySelector('[data-act="copiar"]').onclick = async (e) => {
    try { await navigator.clipboard.writeText(link); e.target.textContent = "¡Copiado!"; }
    catch (_) { prompt("Copia este enlace:", link); }
  };
  const wa = el.querySelector('[data-act="wa"]');
  if (wa) wa.onclick = () => {
    const msg = `Hola ${p.nombre.split(" ")[0]}, aquí puedes ver tu estado de cuenta (cuánto has abonado y cuánto queda): ${link}`;
    window.open(`https://wa.me/${waNumber(p.telefono)}?text=${encodeURIComponent(msg)}`, "_blank");
  };
  const rec = el.querySelector('[data-act="recordar"]');
  if (rec) rec.onclick = () => {
    const r = resumen(p);
    const cuando = r.proximo ? (r.vencido ? ` La fecha de pago era el ${fecha(r.proximo)}.` : ` Tu próxima fecha de pago es el ${fecha(r.proximo)}.`) : "";
    const msg = `Hola ${primerNombre(p)}, te recuerdo que tienes un saldo pendiente de ${money(r.saldo)}.${cuando} Aquí puedes ver tu cuenta: ${link}`;
    window.open(waUrl(p, msg), "_blank");
  };
  el.querySelector('[data-act="ver"]').onclick = () => window.open(link, "_blank");
  el.querySelector('[data-act="nuevo"]').onclick = async () => {
    if (!confirm(`¿Crear un enlace nuevo para ${p.nombre}? El enlace anterior dejará de funcionar.`)) return;
    try { await rpc("cobros_admin_nuevo_enlace", { p_clave: clave, p_id: p.id }); await cargar(); }
    catch (err) { alert(err.message); }
  };
  el.querySelector('[data-form="abono"]').onsubmit = (e) => guardar(e, async (f) => {
    const monto = Number(f.monto.value), dia = f.fecha.value;
    await rpc("cobros_admin_abono", { p_clave: clave, p_persona: p.id, p_monto: monto, p_fecha: dia, p_nota: f.nota.value.trim() });
    return () => avisoPara(p.id, (q, r) => `Hola ${primerNombre(q)}, recibí tu abono de ${money(monto)} del ${fecha(dia)}. ¡Gracias! ` +
      (r.saldo > 0 ? `Te queda un saldo de ${money(r.saldo)}.` : "Con esto quedas al día, ya no debes nada.") + ` Puedes ver tu cuenta aquí: ${linkDe(q)}`);
  });
  el.querySelector('[data-form="deuda"]').onsubmit = (e) => guardar(e, async (f) => {
    const monto = Number(f.monto.value), concepto = f.concepto.value.trim(), vence = f.vence.value || null;
    await rpc("cobros_admin_deuda", { p_clave: clave, p_persona: p.id, p_concepto: concepto, p_monto: monto, p_fecha: f.fecha.value, p_vence: vence });
    return () => avisoPara(p.id, (q, r) => `Hola ${primerNombre(q)}, anoté ${concepto} por ${money(monto)}` + (vence ? `, a pagar a más tardar el ${fecha(vence)}` : "") +
      `. Tu saldo total ahora es ${money(r.saldo)}. Puedes ver tu cuenta aquí: ${linkDe(q)}`);
  });
  el.querySelector('[data-form="persona"]').onsubmit = (e) => guardar(e, (f) =>
    rpc("cobros_admin_persona", { p_clave: clave, p_id: p.id, p_nombre: f.nombre.value.trim(), p_telefono: f.telefono.value.trim(), p_nota: p.nota }));
}

clave ? cargar() : login();
</script>
</body>
</html>
