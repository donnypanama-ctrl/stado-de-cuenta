<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Estado de cuenta</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app"><p class="muted">Cargando tu estado de cuenta…</p></main>
<script src="api.js"></script>
<script>
const app = document.getElementById("app");
const token = new URLSearchParams(location.search).get("c");

function etiqueta(r) {
  if (r.estado === "pagado") return '<span class="pill ok">Pagado</span>';
  if (r.estado === "bad") return '<span class="pill bad">Vencido</span>';
  if (r.estado === "warn") return '<span class="pill warn">Vence pronto</span>';
  return r.proximo ? '<span class="pill ok">Al día</span>' : "";
}

function render(p) {
  const r = resumen(p);
  app.innerHTML = `
    <p class="muted small" style="margin:0">Estado de cuenta de</p>
    <h1>${esc(p.nombre)}</h1>

    <div class="card" style="margin-top:16px">
      <div class="row"><span class="muted">Saldo pendiente</span>${etiqueta(r)}</div>
      <div class="big">${money(r.saldo)}</div>
      <div class="bar"><i style="width:${r.pct.toFixed(1)}%"></i></div>
      <div class="small muted">Has pagado el ${Math.round(r.pct)}% del total</div>
    </div>

    <div class="grid2">
      <div class="stat"><span class="muted small">Total prestado</span><b>${money(p.total_deuda)}</b></div>
      <div class="stat"><span class="muted small">Total abonado</span><b>${money(p.total_abonado)}</b></div>
    </div>
    ${r.proximo ? `<div class="stat" style="margin-top:10px"><span class="muted small">${r.vencido ? "Fecha de pago vencida" : "Próxima fecha de pago"}</span><b>${fecha(r.proximo)}</b></div>` : ""}

    <h2>Préstamos</h2>
    <div class="list">
      ${p.deudas.length ? p.deudas.map((d) => `
        <div class="item">
          <div><div>${esc(concepto(d.concepto))}</div><div class="small muted">${fecha(d.fecha)}${d.vence ? " · vence " + fecha(d.vence) : ""}</div></div>
          <div class="amt">${money(d.monto)}</div>
        </div>`).join("") : '<div class="empty">Sin deudas registradas</div>'}
    </div>

    <h2>Tus abonos</h2>
    <div class="list">
      ${p.abonos.length ? p.abonos.map((a) => `
        <div class="item">
          <div><div>${fecha(a.fecha)}</div>${a.nota ? `<div class="small muted">${esc(a.nota)}</div>` : ""}</div>
          <div class="amt" style="color:var(--accent)">${money(a.monto)}</div>
        </div>`).join("") : '<div class="empty">Todavía no hay abonos</div>'}
    </div>

    <footer>Este enlace es personal. Solo tú puedes ver esta cuenta.<br>Si ves algún error, escríbele a Donny.</footer>`;
}

if (!token) {
  app.innerHTML = '<h1>Enlace incompleto</h1><p class="muted">Abre el enlace exacto que te enviaron.</p>';
} else {
  rpc("cobros_estado", { p_token: token })
    .then((p) => p ? render(p) : (app.innerHTML = '<h1>Enlace no válido</h1><p class="muted">Este enlace ya no funciona. Pídele a Donny uno nuevo.</p>'))
    .catch(() => (app.innerHTML = '<h1>No se pudo cargar</h1><p class="muted">Revisa tu conexión e inténtalo de nuevo.</p>'));
}
</script>
</body>
</html>
